<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Skills Showcase</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #151010;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .circle-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      background: #ff0000;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
    }

    .orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orbit div {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #300d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      font-size: 12px;
      text-align: center;
      padding: 5px;
    }

    .orbit div:hover {
      transform: scale(1.2);
      box-shadow: 0 0 15px rgba(255, 0, 0, 1);
    }

    /* Rotating Layers */
    .layer-1 { animation: rotate 12s linear infinite; }
    .layer-2 { animation: rotate 18s linear infinite reverse; }
    .layer-3 { animation: rotate 25s linear infinite; }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="circle-container">
  <div class="center">Skills</div>

  <!-- Inner Layer -->
  <div class="orbit layer-1" id="layer1"></div>

  <!-- Middle Layer -->
  <div class="orbit layer-2" id="layer2"></div>

  <!-- Outer Layer -->
  <div class="orbit layer-3" id="layer3"></div>
</div>

<script>
  const skills = [
    "Java", "Python", "JavaScript", "HTML", "CSS", "React", "Node",
    "MongoDB", "SQL", "Git", "Docker", "AWS", "Next.js", "Figma",
    "GraphQL", "Firebase", "C", "TypeScript"
  ];

  function createSkillCircles(containerId, skillList, radius) {
    const container = document.getElementById(containerId);
    const totalSkills = skillList.length;
    const angleStep = (2 * Math.PI) / totalSkills;

    skillList.forEach((skill, index) => {
      const angle = index * angleStep;
      const x = Math.cos(angle) * radius + 150; // Centering
      const y = Math.sin(angle) * radius + 150;

      const skillDiv = document.createElement("div");
      skillDiv.innerText = skill;
      skillDiv.style.left = `${x}px`;
      skillDiv.style.top = `${y}px`;

      container.appendChild(skillDiv);
    });
  }

  createSkillCircles("layer1", skills.slice(0, 4), 80);
  createSkillCircles("layer2", skills.slice(4, 8), 130);
  createSkillCircles("layer3", skills.slice(8, 18), 180);
</script>

<script src="assets/oneko.js"></script>

</body>
</html>

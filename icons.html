<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Section</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      text-align: center;
    }
    .skills-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }
    .skill-box {
      background: #121212;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
    }
    .skill-box h3 {
      color: #a385ff;
      margin-bottom: 15px;
    }
    .skill-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .skill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #222;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
    }
    .skill img {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 768px) {
      .skills-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<h1>Technical Skills</h1>

<div class="skills-container">
  <!-- Programming & Development -->
  <div class="skill-box">
    <h3>Programming & Development</h3>
    <div class="skill-list">
      <div class="skill"><img src="https://skillicons.dev/icons?i=java" alt="Java"> Java</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=html" alt="HTML"> HTML</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=css" alt="CSS"> CSS</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=js" alt="JavaScript"> JavaScript</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=ts" alt="TypeScript"> TypeScript</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=python" alt="Python"> Python</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=mysql" alt="MySQL"> MySQL</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=sqlite" alt="SQLite"> SQLite</div>
    </div>
  </div>

  <!-- Frameworks -->
  <div class="skill-box">
    <h3>Frameworks</h3>
    <div class="skill-list">
      <div class="skill"><img src="https://skillicons.dev/icons?i=react" alt="React"> React</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=react" alt="React Native"> React Native</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=selenium" alt="Selenium"> Selenium</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=hibernate" alt="Hibernate"> Hibernate</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=nextjs" alt="Next.js"> Next.js</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=expo" alt="Expo"> Expo</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=cucumber" alt="Cucumber"> Cucumber</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=maven" alt="Maven"> Maven</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=javafx" alt="JavaFX"> JavaFX</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=git" alt="Git"> Git</div>
    </div>
  </div>

  <!-- Tools -->
  <div class="skill-box">
    <h3>Tools</h3>
    <div class="skill-list">
      <div class="skill"><img src="https://skillicons.dev/icons?i=postman" alt="Postman"> Postman</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=figma" alt="Figma"> Figma</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=jira" alt="Jira"> Jira</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=github" alt="GitHub"> GitHub</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=ps" alt="Photoshop"> Photoshop</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=lightroom" alt="Lightroom"> Lightroom</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=blender" alt="Blender"> Blender</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=docker" alt="Docker"> Docker</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=androidstudio" alt="Android Studio"> Android Studio</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=idea" alt="IntelliJ IDEA"> IntelliJ IDEA</div>
      <div class="skill"><img src="https://skillicons.dev/icons?i=chatgpt" alt="ChatGPT"> ChatGPT</div>
    </div>
  </div>
</div>

</body>
</html>
